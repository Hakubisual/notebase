name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - uses: oven-sh/setup-bun@v2
            - run: npm ci
            - run: npm run typecheck
            - run: bun test
            - run: npm run build
            - run: npm run lint
