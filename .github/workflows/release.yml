name: Release

on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing version tag (for example 0.1.1)'
                required: true

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ env.TAG }}

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - uses: oven-sh/setup-bun@v2

            - name: Check tag matches manifest version
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  [ "$version" = "$TAG" ] || { echo "Tag $TAG does not match manifest version $version"; exit 1; }

            - name: Build and test
              run: |
                  npm ci
                  npm run typecheck
                  bun test
                  npm run build
                  npm run lint
                  npm run package

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag main.js manifest.json styles.css
